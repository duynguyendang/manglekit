orchestrator:
  type: sandwich
  name: default
  params:
    llm: default
    retriever: default

llm:
  name: default
  provider: mock-llm # Use a mock LLM that doesn't call an external API.
  params:
    responses:
      - "This is a mock response."

retriever:
  name: default
  provider: in-memory
  params:
    docs:
      - "This is the first document."
      - "This is the second document."
