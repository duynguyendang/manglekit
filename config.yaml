orchestrator:
  maxContextTokens: 4000
  fallbackThreshold: 0.5

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  apiKey: "${OPENAI_API_KEY}"

retrieval:
  topK: 5
  vector:
    model: "all-MiniLM-L6-v2"
  keyword:
    analyzer: "english"
  fusion: "rrf"

rag:
  embedder:
    model: "embedding-001"
  retriever:
    path: "docs"

mangle:
  rulesFile: "rules.dlog"
  factsFile: "data"
