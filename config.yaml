orchestrator:
  maxContextTokens: 4000
  fallbackThreshold: 0.5

llm:
  provider: "mock"  # or "openai"
  model: "gpt-4o-mini"
  apiKey: "${LLM_API_KEY}"
  maxTokens: 500

retrieval:
  topK: 5
  vector:
    model: "all-MiniLM-L6-v2"
  keyword:
    analyzer: "english"
  fusion: "rrf"

mangle:
  rulesFile: "rules.dlog"
  factsFile: "facts.db"