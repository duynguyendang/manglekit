orchestrator:
  type: sandwich
embedder:
  name: openai
  params:
    model: ${EMBEDDER_MODEL}
retriever:
  name: in-memory
  params:
    documents:
      - id: env-doc
        text: "Environment configured document"
        source: env-doc.md
        uri: env-doc.md
reranker:
  name: cosine
  params:
    topK: 1
llm:
  name: ${LLM_PROVIDER}
  params:
    model: ${LLM_MODEL}
fallbackThreshold: ${FALLBACK_THRESHOLD}
maxTokens: ${MAX_TOKENS}
topK: ${TOPK}
