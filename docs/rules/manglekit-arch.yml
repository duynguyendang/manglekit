rules:
  - id: R2-no-init-in-providers
    message: "init() forbidden in providers; use explicit Register(...)"
    severity: ERROR
    languages: [go]
    patterns:
      - pattern: |
          func init() {
            ...
          }
    paths:
      include:
        - "internal/providers/**"
        - "providers/all/**"

  - id: R3-orchestrator-imports-providers
    message: "Orchestrators (pipeline/**) must not import concrete providers (internal/providers/*)"
    severity: ERROR
    languages: [go]
    patterns:
      - pattern: import "github.com/duynguyendang/manglekit/internal/providers/..."
    paths:
      include:
        - "pipeline/**"

  - id: R6-llm-client-bypass
    message: "LLM provider must not construct clients directly; use DI"
    severity: ERROR
    languages: [go]
    pattern-either:
      - pattern: openai.NewClient(...)
      - pattern: http.Client{...}
    paths:
      include:
        - "internal/providers/llm/**"

  - id: R10-hybrid-magic-numbers
    message: "Magic number detected in hybrid retriever. RRF_K and sub-retrievers should be configurable."
    severity: WARNING
    languages: [go]
    pattern-either:
      - pattern: "60"
      - pattern: "\"bm25\""
      - pattern: "\"dense\""
    paths:
      include:
        - "internal/providers/hybrid/**"

  - id: R13-core-dependency-violation
    message: "Core package dependency violation: core must not import internal/providers, pipeline, or the root builder."
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-either:
        - pattern: import "github.com/duynguyendang/manglekit/internal/providers/..."
        - pattern: import "github.com/duynguyendang/manglekit/pipeline/..."
        - pattern: import "github.com/duynguyendang/manglekit"
    paths:
      include:
        - "core/**"

  - id: R14-no-builder-in-factory
    message: "Provider factory must not accept diapi.Builder; use diapi.*Deps via handler"
    severity: ERROR
    languages: [go]
    pattern-either:
      - pattern: "diapi.Builder"
    paths:
      include:
        - "internal/providers/**"

  - id: R15-declarative-arbitrary-stateprovider
    message: "Declarative orchestrator must not pick the first StateProvider; make it configurable"
    severity: WARNING
    languages: [go]
    patterns:
      - pattern: "for _, provider := range deps.StateProviders"
    paths:
      include:
        - "pipeline/declarative/**"

  - id: R18-no-direct-stdout
    message: "No direct stdout/logging in production paths; use core.Logger"
    severity: ERROR
    languages: [go]
    pattern-either:
      - pattern: "fmt.Println("
      - pattern: "fmt.Printf("
      - pattern: "log.Printf("
    paths:
      include:
        - "pipeline/**"
        - "internal/providers/**"

  - id: R19-no-env-parse-in-providers
    message: "Providers and orchestrators must not parse environment variables directly; bind via config"
    severity: WARNING
    languages: [go]
    pattern-either:
      - pattern: "os.Getenv("
    paths:
      include:
        - "internal/providers/**"
        - "pipeline/**"
