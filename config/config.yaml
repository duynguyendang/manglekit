orchestrator:
  maxContextTokens: 4000
  fallbackThreshold: 0.5
  intentParser:
    flowName: "parse_intent_ner"
  retrieval:
    path: "docs"
    hybrid:
      bm25:
        topK: 10
      dense:
        topK: 10
  reranker:
    topK: 5

llm:
  provider: "google"
  model: "gemini-1.5-flash-latest"
  apiKey: "${GOOGLE_API_KEY}"

embedder:
  provider: "google"
  model: "text-embedding-004"
  apiKey: "${GOOGLE_API_KEY}"

mangle:
  rulesFile: "config/mangle"