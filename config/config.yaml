orchestrator:
  maxContextTokens: 4000
  fallbackThreshold: 0.5
  intentParser:
    flowName: "parse_intent_ner"

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  apiKey: "${OPENAI_API_KEY}"

retrieval:
  corpus:
    path: "docs"
    chunkSize: 220
    chunkOverlap: 40
  hybrid:
    bm25:
      must: 4
      should: 6
    dense:
      topK: 20
      model: "text-embedding-004"
  rerank:
    mrl:
      topK: 8
      dimensions: [512, 768]

mangle:
  rulesFile: "config/mangle/main.dlog"
  factsFile: "config/mangle/*/*.dlog"
