retriever:
  name: "in-memory"
  # The documents are provided programmatically in main.go for this example.

llm:
  name: "google"
  params:
    model: "gemini-2.5-flash"
    apiKey: "${GOOGLE_API_KEY}"
    promptTemplate: |
      Ahoy, matey! Here's the treasure map to the answer you seek.

      Use the following pieces of context to answer the question at the end.
      If you don't know the answer, just say that you don't know, don't try to make up an answer.

      {{.Context}}

      Question: {{.Query}}

      Helpful Answer: