providers:
  google:
    apiKey: "${GOOGLE_API_KEY}"

rules:
  name: "mangle"
  params:
    path:
      - "./rules/logic.dlog"
    schemaSources:
      - type: "rdf"
        path: "./rules/design_docs.ttl"
    defaultConverters: true

retriever:
  name: "bm25"
  params:
    path: "./corpus"

llm:
  name: "google"
  params:
    model: "gemini-2.5-flash"
