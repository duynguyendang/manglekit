providers:
  # A dummy API key is required to satisfy the builder's validation,
  # even though the LLM is not used in this example.
  google:
    apiKey: "${GOOGLE_API_KEY}"

rules:
  name: "mangle"
  params:
    path:
      - "./rules/kg_query.dlog"
    schemaSources:
      - type: "rdf"
        path: "./data/ontology.ttl"

# Minimal retriever and LLM to satisfy the orchestrator's requirements.
retriever:
  name: "in-memory"

llm:
  name: "google"
  params:
    model: "gemini-2.5-flash"
    apiKey: "${GOOGLE_API_KEY}"