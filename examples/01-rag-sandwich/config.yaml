orchestrator: sandwich_pipeline
components:
  - name: llm_main
    kind: llm
    type: openai
    params:
      model: "gpt-4"
  - name: embedder_main
    kind: embedder
    type: openai
    params:
      model: "text-embedding-ada-002"
  - name: vstore_main
    kind: vectorstore
    type: localvec
    params:
      path: "/tmp/vectorstore"
  - name: retriever_dense
    kind: retriever
    type: dense
    params:
      embedder: "embedder_main"
      vectorstore: "vstore_main"
  - name: retriever_bm25
    kind: retriever
    type: bm25
    params: {}
  - name: retriever_hybrid_main
    kind: retriever
    type: hybrid
    params:
      retrievers: ["retriever_dense", "retriever_bm25"]
      rrf_k: 60
  - name: sandwich_pipeline
    kind: orchestrator
    type: sandwich
    params:
      llm: "llm_main"
      retriever: "retriever_hybrid_main"
