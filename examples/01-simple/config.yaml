orchestrator: declarative_pipeline
components:
  - name: llm_main
    kind: llm
    type: openai
    params:
      model: "gpt-4"
  - name: embedder_main
    kind: embedder
    type: openai
    params:
      model: "text-embedding-ada-002"
  - name: vstore_main
    kind: vectorstore
    type: localvec
    params:
      path: "/tmp/vectorstore"
  - name: retriever_dense
    kind: retriever
    type: dense
    params:
      embedder: "embedder_main"
      vectorstore: "vstore_main"
  - name: my_memory_store
    kind: stateprovider
    type: inmemory
    params:
      context_window: 10
  - name: declarative_pipeline
    kind: orchestrator
    type: declarative
    params:
      state_provider: "my_memory_store"
      steps:
        - tool: "retriever_dense"
          params:
            query: "{{.query}}"
        - tool: "llm_main"
          params:
            prompt: "Answer the question '{{.query}}' based on the following documents: {{.retriever_dense.documents}}"
