components:
  - name: "mangle-rules"
    kind: "rules"
    params:
      provider: "mangle"
      path:
        - "./rules/kb.facts"
        - "./rules/retrieval.dlog"
      defaultConverters: true
      fileFirst: true

  - name: "bm25-retriever"
    kind: "retriever"
    params:
      provider: "bm25"
      path: "./data"

  - name: "google-llm"
    kind: "llm"
    params:
      provider: "google"
      model: "gemini-1.5-flash"
      apiKey: "${GOOGLE_API_KEY}"
