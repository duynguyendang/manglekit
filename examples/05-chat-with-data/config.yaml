# Configuration for the 'chat-with-data' example using the default Sandwich orchestrator.

# The Mangle provider is configured to load our logic and run it in the pre-process stage.
rules:
  name: "mangle"
  params:
    path:
      - "./rules/kb.facts"
      - "./rules/retrieval.dlog"
    defaultConverters: true
    fileFirst: true

# A simple retriever to fetch the document content AFTER Mangle has identified it.
retriever:
  name: "bm25"
  params:
    path: "./data"

# The LLM to generate the final answer.
llm:
  name: "google"
  params:
    model: "gemini-2.5-flash"
    apiKey: "${GOOGLE_API_KEY}"