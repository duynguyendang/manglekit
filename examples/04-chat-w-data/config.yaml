# Manglekit configuration for the chat-w-data example.

# Explicitly select the 'declarative' orchestrator and give the flow a name.
orchestrator:
  type: "declarative"
  flowName: "access-control"

rules:
  name: "mangle"
  params:
    # A list of Datalog files to load, relative to this file.
    path:
      - "policy/access_control.dlog"
      - "policy/facts.dlog"
    # Explicitly disable the default fact converters.
    defaultConverters: false
    # A list of named converters to run in the 'pre' stage.
    preProcess:
      - "custom-converter"  # Generates the request(...) fact.