orchestrator:
  type: sandwich
logging:
  level: debug
  format: console
embedder:
  name: openai
  params:
    model: text-embedding-3-small
retriever:
  name: in-memory
  params:
    documents:
      - id: doc-1
        text: "First document"
        source: doc-1.md
        uri: doc-1.md
      - id: doc-2
        text: "Second document"
        source: doc-2.md
        uri: doc-2.md
reranker:
  name: cosine
  params:
    topK: 2
llm:
  name: openai
  params:
    model: gpt-4o-mini
fallbackThreshold: 0.42
maxTokens: 256
topK: 3
